<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>บันทึกรายรับรายจ่าย</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>💰 บันทึกรายรับรายจ่าย</h1><p>Income & Expense Tracker</p></header><section class="stats"><article><span>รายรับ</span><strong id="income">฿0.00</strong></article><article><span>รายจ่าย</span><strong id="expense">฿0.00</strong></article><article><span>ยอดคงเหลือ</span><strong id="balance">฿0.00</strong></article></section><section class="panel"><h2 id="formTitle">เพิ่มรายการ</h2><form id="form"><input type="hidden" id="editId"><label>ประเภท<select id="type" required><option value="income">รายรับ</option><option value="expense">รายจ่าย</option></select></label><label>จำนวนเงิน (บาท)<input id="amount" type="number" min="0.01" step="0.01" required></label><label>หมวดหมู่<input id="category" maxlength="80" placeholder="เช่น เงินเดือน / อาหาร" required></label><label>วันที่<input id="date" type="date" required></label><label class="full">รายละเอียด<input id="note" maxlength="200" placeholder="รายละเอียดเพิ่มเติม (ไม่บังคับ)"></label><div class="actions"><button type="submit">บันทึกรายการ</button><button type="button" id="cancel" class="secondary" hidden>ยกเลิกแก้ไข</button></div></form><p id="message" role="status"></p></section><section class="panel"><h2>ประวัติรายการ</h2><div class="tablewrap"><table><thead><tr><th>วันที่</th><th>ประเภท</th><th>หมวดหมู่</th><th>รายละเอียด</th><th>จำนวนเงิน</th><th>จัดการ</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="app.js"></script></body></html>
